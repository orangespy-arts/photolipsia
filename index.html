<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photolipsia</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/",
        "@sparkjsdev/spark": "/node_modules/@sparkjsdev/spark/dist/spark.module.js"
      }
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; height: 100vh; background: #0b0b10; color: #e8e6e3;
      font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
      overflow: hidden;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: fixed; top: 1rem; left: 1rem; z-index: 10; }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.08em; margin: 0 0 0.5rem; }
    #status { color: #8a8782; min-height: 1.5em; margin: 0; }
    #status.error { color: #e0705f; }
    .toggle {
      margin-top: 0.4rem; padding: 0.25rem 0.6rem;
      background: #1c1c24; color: #b8b5b0; border: 1px solid #2c2c36;
      border-radius: 6px; font: inherit; font-size: 0.75rem; cursor: pointer;
    }
    .toggle.on { color: #e8e6e3; border-color: #5b8dd9; }
    #monitor {
      position: fixed; left: 1rem; bottom: 1rem; z-index: 10;
      width: 300px; background: rgba(11, 11, 16, 0.7); border-radius: 8px;
      padding: 0.75rem; backdrop-filter: blur(4px);
    }
    .row { display: grid; grid-template-columns: 72px 1fr 44px; gap: 0.5em; align-items: center; margin: 0.25rem 0; }
    .label { color: #8a8782; font-size: 0.75rem; }
    .bar { height: 6px; background: #1c1c24; border-radius: 3px; overflow: hidden; }
    .fill { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #5b8dd9, #d9c25b); }
    .value { text-align: right; font-size: 0.75rem; color: #b8b5b0; }
    .meta { color: #6a6762; font-size: 0.75rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hud">
    <h1>PHOTOLIPSIA</h1>
    <p id="status">loading…</p>
    <button id="beat-toggle" class="toggle" hidden type="button">beat: —</button>
  </div>
  <div id="monitor"></div>
  <script>
    // surface async failures that would otherwise vanish into the console
    window.addEventListener('error', (e) => {
      const el = document.getElementById('status');
      if (el) { el.textContent = 'page error: ' + e.message; el.classList.add('error'); }
    });
    window.addEventListener('unhandledrejection', (e) => {
      const el = document.getElementById('status');
      if (el) { el.textContent = 'async error: ' + (e.reason?.message ?? e.reason); el.classList.add('error'); }
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
