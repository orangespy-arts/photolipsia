<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手柄检测 · Photolipsia</title>
  <link rel="stylesheet" href="/src/ui/gamepad.css">
</head>
<body>
  <main>
    <a href="/">← 返回 Photolipsia</a>
    <a href="/?vj=1&amp;scene=s01" style="margin-left:20px">进入手柄 VJ →</a>
    <p class="eyebrow">PHOTOLIPSIA / INPUT CHECK</p>
    <h1>手柄检测</h1>
    <p>点击下方按钮，再按一下手柄 A 键。依次拨动双摇杆、扣动两个扳机，然后测试其余按键。</p>
    <button id="activate" type="button">开始检测 / 重新检测</button>
    <p id="status" role="status">等待检测…</p>
    <p id="device">尚未识别手柄</p>
    <label>摇杆死区 <input id="deadzone" type="range" min="0" max="0.4" step="0.01" value="0.15"> <output id="deadzone-value">15%</output></label>
    <p class="hint">死区过滤摇杆松手后的轻微漂移。下方同时显示原始读数和过滤后的读数。</p>
    <section id="mapped" hidden>
      <div class="sticks">
        <article><h2>左摇杆</h2><div class="stick"><i id="left-dot"></i></div><p id="left-value"></p></article>
        <article><h2>右摇杆</h2><div class="stick"><i id="right-dot"></i></div><p id="right-value"></p></article>
      </div>
      <div class="triggers"><label>LT <meter id="lt" min="0" max="1" value="0"></meter><output id="lt-value">0.00</output></label><label>RT <meter id="rt" min="0" max="1" value="0"></meter><output id="rt-value">0.00</output></label></div>
    </section>
    <h2>按键</h2><div id="buttons" class="buttons"></div>
    <h2>原始轴读数</h2><pre id="axes">—</pre>
    <p class="hint">支持拔插重连。切换窗口时暂停读数；回到页面继续。本页只检测输入，尚未控制场景或 Hydra。</p>
  </main>
  <script type="module" src="/src/ui/gamepadMonitor.js"></script>
</body>
</html>
