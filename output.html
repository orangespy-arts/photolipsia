<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Photolipsia · Output</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    [hidden] { display: none; }
    #note { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #777;
      font: 14px/1.6 ui-monospace, Consolas, monospace; text-align: center; transition: opacity 0.6s; }
    #note.gone { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="out-canvas"></canvas>
  <video id="out" autoplay muted playsinline></video>
  <pre id="debug" hidden style="position:fixed;left:8px;top:8px;margin:0;color:#0f0;background:#000c;font:12px monospace;padding:4px 6px;z-index:2"></pre>
  <p id="note">Waiting for the console picture…<br>Double-click or press F for fullscreen</p>
  <script type="module" src="/src/output.js"></script>
</body>
</html>
